name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  routing:
    name: Fork and branch rules
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request target
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [[ "$BASE_BRANCH" == main ]] && [[ "$HEAD_REPO" != "$BASE_REPO" || "$HEAD_BRANCH" != develop ]]; then
            echo 'Open contributor pull requests against develop. Only upstream develop can be merged into main.'
            exit 1
          fi
          if [[ "$BASE_BRANCH" == develop && "$HEAD_REPO" == "$BASE_REPO" && "$HEAD_BRANCH" != main ]]; then
            echo 'Open contributions from a branch in your fork.'
            exit 1
          fi

  test:
    name: Windows build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore ThoriumInbox.slnx --locked-mode
      - run: dotnet test ThoriumInbox.slnx --no-restore --configuration Release
      - run: dotnet build src/ThoriumInbox/ThoriumInbox.csproj --no-restore --configuration Release

      - name: Build unsigned Windows x64 installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $innoSetup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          $innoDirectory = Join-Path $env:RUNNER_TEMP 'Inno Setup 6'
          $downloadUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
          $expectedHash = '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $innoSetup
          if ((Get-FileHash -LiteralPath $innoSetup -Algorithm SHA256).Hash -ne $expectedHash) {
              throw 'Inno Setup download checksum did not match.'
          }

          $destination = '/DIR="{0}"' -f $innoDirectory
          $setup = Start-Process -FilePath $innoSetup -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', $destination
          ) -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
              throw "Inno Setup installation failed with exit code $($setup.ExitCode)."
          }

          $compiler = Join-Path $innoDirectory 'ISCC.exe'
          ./scripts/Build-Installer.ps1 -UnsignedTestBuild -InnoCompiler $compiler

      - name: Upload unsigned test installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: thorium-inbox-windows-x64-unsigned-test
          path: |
            artifacts/test-installer/ThoriumInbox-Setup-x64-Unsigned-Test.exe
            artifacts/test-installer/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  portable:
    name: Shared tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ThoriumInbox.Tests/ThoriumInbox.Tests.csproj --locked-mode
      - run: dotnet test tests/ThoriumInbox.Tests/ThoriumInbox.Tests.csproj --no-restore --configuration Release

  linux-installer:
    name: Linux x64 test installer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Lint installer scripts
        run: shellcheck scripts/Build-LinuxInstaller.sh scripts/Build-MacInstaller.sh
      - name: Build unsigned Debian package
        run: ./scripts/Build-LinuxInstaller.sh
      - name: Verify package metadata and executable
        shell: bash
        working-directory: artifacts/test-installer/linux-x64
        run: |
          package=ThoriumInbox-linux-x64-Unsigned-Test.deb
          sha256sum --check SHA256SUMS.txt
          dpkg-deb --info "$package"
          test "$(dpkg-deb --field "$package" Package)" = thorium-inbox
          test "$(dpkg-deb --field "$package" Architecture)" = amd64
          apt-get --simulate --no-install-recommends install "$PWD/$package"

          payload=$(mktemp -d)
          trap 'rm -rf -- "$payload"' EXIT
          dpkg-deb --extract "$package" "$payload"
          test "$(readlink "$payload/usr/bin/thorium-inbox")" = /opt/thorium-inbox/ThoriumInbox
          desktop="$payload/usr/share/applications/io.github.katus4.thoriuminbox.desktop"
          grep -Fx 'Exec=/usr/bin/thorium-inbox' "$desktop"
          test -s "$payload/usr/share/icons/hicolor/128x128/apps/thorium-inbox.png"
          executable="$payload/opt/thorium-inbox/ThoriumInbox"
          test -x "$executable"
          for library in libcoreclr.so libSkiaSharp.so libpdfium.so; do
            test -s "$payload/opt/thorium-inbox/$library"
          done
          version=$(dpkg-deb --field "$package" Version)
          actual_version=$("$executable" --version)
          test "$actual_version" = "$version"

          export XDG_CONFIG_HOME="$payload/config" XDG_DATA_HOME="$payload/data"
          export XDG_DOCUMENTS_DIR="$payload/documents"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_DOCUMENTS_DIR"
          printf 'XDG_DOCUMENTS_DIR="%s"\n' "$XDG_DOCUMENTS_DIR" > "$XDG_CONFIG_HOME/user-dirs.dirs"
          status=0
          timeout --kill-after=5s 8s xvfb-run -a "$executable" > "$payload/desktop.log" 2>&1 || status=$?
          if [[ "$status" != 124 ]]; then
            cat "$payload/desktop.log"
            echo "Desktop smoke exited unexpectedly with status $status."
            exit 1
          fi
          grep -F 'Watching for PDFs and EPUBs.' "$XDG_DATA_HOME/Thorium Inbox/activity.log"
      - name: Upload unsigned test installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: thorium-inbox-linux-x64-unsigned-test
          path: |
            artifacts/test-installer/linux-x64/ThoriumInbox-linux-x64-Unsigned-Test.deb
            artifacts/test-installer/linux-x64/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos-installer:
    name: macOS ${{ matrix.platform }} test installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: x64
            machine: x86_64
          - os: macos-15
            platform: arm64
            machine: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build unsigned macOS package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/Build-MacInstaller.sh "$PLATFORM"
      - name: Verify package metadata and executable
        shell: bash
        working-directory: artifacts/test-installer/macos-${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
          MACHINE: ${{ matrix.machine }}
        run: |
          package="ThoriumInbox-macos-$PLATFORM-Unsigned-Test.pkg"
          shasum -a 256 --check SHA256SUMS.txt
          payload=$(mktemp -d)
          trap 'rm -rf -- "$payload"' EXIT
          pkgutil --expand-full "$package" "$payload/expanded"
          metadata="$payload/expanded/PackageInfo"
          identifier=io.github.katus4.thoriuminbox
          test "$(xmllint --xpath 'string(/pkg-info/@identifier)' "$metadata")" = "$identifier"
          test "$(xmllint --xpath 'string(/pkg-info/@install-location)' "$metadata")" = /Applications
          version=$(xmllint --xpath 'string(/pkg-info/@version)' "$metadata")
          app="$payload/expanded/Payload/Thorium Inbox.app/Contents"
          plutil -lint "$app/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = "$identifier"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$app/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleVersion raw -o - "$app/Info.plist")" = "$version"
          test "$(plutil -extract CFBundleExecutable raw -o - "$app/Info.plist")" = ThoriumInbox
          icon=$(plutil -extract CFBundleIconFile raw -o - "$app/Info.plist")
          test -s "$app/Resources/$icon"
          executable="$app/MacOS/ThoriumInbox"
          test -x "$executable"
          test "$(lipo -archs "$executable")" = "$MACHINE"
          for library in libcoreclr.dylib libAvaloniaNative.dylib libSkiaSharp.dylib libpdfium.dylib; do
            lipo "$app/MacOS/$library" -verify_arch "$MACHINE"
          done
          actual_version=$("$executable" --version)
          test "$actual_version" = "$version"
      - name: Upload unsigned test installer
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: thorium-inbox-macos-${{ matrix.platform }}-unsigned-test
          path: |
            artifacts/test-installer/macos-${{ matrix.platform }}/ThoriumInbox-macos-${{ matrix.platform }}-Unsigned-Test.pkg
            artifacts/test-installer/macos-${{ matrix.platform }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
